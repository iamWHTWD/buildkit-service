{{- if and .Values.packageMirror.enabled .Values.packageMirror.networkPolicy.enabled }}
{{- $namespace := include "buildkit-service.packageMirror.namespace" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "buildkit-service.packageMirror.fullname" . }}-ingress
  namespace: {{ $namespace }}
  labels:
    {{- include "buildkit-service.packageMirror.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $namespace }}
        {{- range .Values.packageMirror.networkPolicy.allowedNamespaces | default list }}
        {{- if ne . $namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- end }}
{{- end }}
