{{- if .Values.buildkit.enabled -}}
{{- $imagePullSecretName := include "buildkit-service.imagePullSecretName" . -}}
{{- if and (eq (include "buildkit-service.imagePullSecretsEnabled" .) "true") $imagePullSecretName }}
{{- $dockerconfigjson := include "buildkit-service.registryConfigJsonB64" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $imagePullSecretName }}
  namespace: {{ include "buildkit-service.namespace" . }}
  labels:
    {{- include "buildkit-service.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerconfigjson | quote }}
{{- end }}

{{- if .Values.buildctlDaemon.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "buildkit-service.buildctlDaemonSecretName" . }}
  namespace: {{ include "buildkit-service.namespace" . }}
  labels:
    {{- include "buildkit-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: buildctl-daemon
type: Opaque
data:
  token: {{ required "Values.buildctlDaemon.auth.token is required" .Values.buildctlDaemon.auth.token | b64enc | quote }}
{{- end }}
{{- end }}
